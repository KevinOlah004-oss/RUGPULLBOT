<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RugpullMasterAI</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Solana -->
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #111 0%, #000 60%);
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      padding: 40px 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    p {
      opacity: 0.8;
      margin-bottom: 30px;
    }

    .card {
      background: #0f0f0f;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 0 30px rgba(255,255,255,0.05);
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      margin-top: 12px;
      background: linear-gradient(135deg, #6f5cff, #8f7bff);
      color: white;
    }

    button.secondary {
      background: #1a1a1a;
    }

    .footer {
      font-size: 12px;
      opacity: 0.4;
      margin-top: 30px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Rugpullmasterai</h1>
    <p>Snipe. Frontrun. Dominate.</p>

    <div class="card">
      <h3>Support the Project</h3>
      <p>Send SOL to keep Rugmaster running</p>

      <button onclick="sendSol(0.05)">Send 0.05 SOL</button>
      <button onclick="sendSol(0.1)">Send 0.1 SOL</button>
      <button onclick="sendSol(0.5)">Send 0.5 SOL</button>
    </div>

    <div class="footer">
      Powered by rugmaster • Phantom Wallet
    </div>
  </div>

<script>
  Telegram.WebApp.ready();
  const RECIPIENT = new solanaWeb3.PublicKey(
    2VtxAwqBZXSYoAisj57S39SHoXH6KHhKaNJKHPAUNYHW
  );

  async function sendSol(amount) {
    if (!window.solana || !window.solana.isPhantom) {
      alert("Phantom Wallet not found");
      return;
    }

    const connection = new solanaWeb3.Connection(
      solanaWeb3.clusterApiUrl("mainnet-beta")
    );

    const resp = await window.solana.connect();
    const fromPubkey = resp.publicKey;

    const transaction = new solanaWeb3.Transaction().add(
      solanaWeb3.SystemProgram.transfer({
        fromPubkey,
        toPubkey: RECIPIENT,
        lamports: amount * solanaWeb3.LAMPORTS_PER_SOL
      })
    );

    transaction.feePayer = fromPubkey;
    transaction.recentBlockhash =
      (await connection.getLatestBlockhash()).blockhash;

    const signed = await window.solana.signTransaction(transaction);
    const signature = await connection.sendRawTransaction(
      signed.serialize()
    );

    Telegram.WebApp.showAlert("Transaction sent!\n" + signature);
  }
</script>
</body>
</html>
